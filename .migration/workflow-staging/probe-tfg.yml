name: Verifica accesso pubblico pagine TFG

on:
  push:
    paths:
      - 'scripts/check_tfg_public.py'
      - '.github/workflows/probe-tfg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla solo le pagine pubbliche
        run: python scripts/check_tfg_public.py
