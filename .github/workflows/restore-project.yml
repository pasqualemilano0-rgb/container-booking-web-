name: Ripristino sorgenti progetto
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-project.yml']
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'pasqualemilano0-rgb/container-booking-web-'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla il bundle sorgente e il commit iniziale
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .migration/clean-single-commit.bundle)" = '6a4b1ca545119062a5f225404304e45e0b294112'
          git bundle verify .migration/clean-single-commit.bundle
          git fetch .migration/clean-single-commit.bundle refs/heads/main
          target="$(git rev-parse FETCH_HEAD)"
          test "$target" = '1e1e32e3cc2491abda9ef6b29a7fac8f728ba1c1'
          test "$(git rev-list --count "$target")" = '1'
          test "$(git rev-parse "$target^{tree}")" = 'fceefb72f892541b49b1a580acb9c6cc0cf0d9e1'
          test "$(git ls-tree -r --name-only "$target" | wc -l)" -eq 123
          mkdir /tmp/container-booking-clean
          git archive "$target" | tar -x -C /tmp/container-booking-clean
      - name: Prova codice e regole dei terminali prima del ripristino
        shell: bash
        working-directory: /tmp/container-booking-clean
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check requests beautifulsoup4
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Ripristina i file applicativi senza modificare i workflow protetti
        shell: bash
        run: |
          set -euo pipefail
          target='1e1e32e3cc2491abda9ef6b29a7fac8f728ba1c1'
          test "$(git rev-parse "$target^{tree}")" = 'fceefb72f892541b49b1a580acb9c6cc0cf0d9e1'
          mkdir -p .migration/workflow-staging
          for file in /tmp/container-booking-clean/.github/workflows/*.yml; do
            cp "$file" ".migration/workflow-staging/$(basename "$file")"
          done
          tar -C /tmp/container-booking-clean --exclude='./.github/workflows' -cf - . | tar -xf -
          git rm -f .migration/clean-single-commit.bundle
          git add -A
          if git diff --cached --name-only | grep '^.github/workflows/'; then
            echo 'Non modificare i workflow con il token GitHub Actions.' >&2
            exit 1
          fi
          test "$(find .migration/workflow-staging -maxdepth 1 -name '*.yml' | wc -l)" -eq 18
          git config user.name 'Repository maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore application sources'
          git push origin 'HEAD:refs/heads/main'
          echo 'File applicativi pubblicati; i workflow verranno ripristinati con permessi dedicati.'
