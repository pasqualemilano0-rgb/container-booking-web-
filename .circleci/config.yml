version: 2.1
# Offline regression only: no secrets, production API calls, or deployments.
workflows:
  essential-offline:
    jobs:
      - booking-regression
      - porti-snapshot-regression
jobs:
  booking-regression:
    docker:
      - image: cimg/node:22.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Essential offline regression
          command: |
            set -eu
            node --test tests/cloudflare_porti_backup.test.mjs tests/booking_search.test.mjs tests/cloudflare_tfg_booking.test.mjs tests/cloudflare_rate_limit.test.mjs tests/cloudflare_worker.test.mjs tests/tfg_schedule.test.mjs tests/conateco_rules.test.mjs

  porti-snapshot-regression:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install offline parser test dependencies
          command: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run:
          name: Vessel fetch and snapshot publishing regression
          command: |
            set -eu
            python -m unittest discover -s tests -p 'test_fetch_*.py' -v
            python -m unittest discover -s tests -p 'test_publish_snapshots.py' -v
