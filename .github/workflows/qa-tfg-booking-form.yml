name: Diagnostica modulo booking pubblico TFG (senza booking)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa_tfg_booking_form.py'
      - '.github/workflows/qa-tfg-booking-form.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect public TFG booking form without submitting numbers
        run: python -m scripts.qa_tfg_booking_form
