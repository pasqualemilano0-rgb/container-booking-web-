name: QA Cloudflare Workers Backend
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'tests/cloudflare_*.test.mjs'
      - '.github/workflows/qa-cloudflare.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'tests/cloudflare_*.test.mjs'
      - '.github/workflows/qa-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintassi
        run: |
          for file in cloudflare/*.mjs; do node --check "$file"; done
      - name: Test endpoints e parser
        run: node --test tests/cloudflare_*.test.mjs
      - name: Compila il Worker con Wrangler senza pubblicare
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/container-booking-worker-build
