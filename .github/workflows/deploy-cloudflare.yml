name: Deploy Cloudflare Worker Container Booking
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'tests/cloudflare_*.test.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-container-booking-deploy
  cancel-in-progress: false
jobs:
  verify:
    name: Validate Cloudflare backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend modules and automated tests
        run: |
          set -euo pipefail
          for file in cloudflare/*.mjs; do node --check "$file"; done
          node --test tests/cloudflare_*.test.mjs
  deploy:
    needs: verify
    # No external account is changed until its owner enables the variable.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Cloudflare parser and API before deploying
        run: |
          for file in cloudflare/*.mjs; do node --check "$file"; done
          node --test tests/cloudflare_*.test.mjs
      - name: Deploy reviewed Worker monitor and booking adapter
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: '4.156.0'
          command: deploy --config wrangler.jsonc
